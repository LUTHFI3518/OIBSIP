<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple JavaScript Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-container">
    <div class="calculator">
      <input type="text" id="display" readonly placeholder="0">

      <div class="keypad">
        <button class="btn btn-mem" data-action="mc">MC</button>
        <button class="btn btn-mem" data-action="mr">MR</button>
        <button class="btn btn-mem" data-action="ms">MS</button>
        <button class="btn btn-mem" data-action="mplus">M+</button>

        <button class="btn btn-action" data-value="(">(</button>
        <button class="btn btn-action" data-value=")">)</button>
        <button class="btn btn-action" data-action="clear">C</button>
        <button class="btn btn-op" data-value="÷">÷</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn btn-op" data-value="×">×</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn btn-op" data-value="-">-</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn btn-op" data-value="+">+</button>

        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn btn-equals" data-action="equal">=</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
